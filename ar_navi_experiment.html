<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR避難ナビ 実験版</title>
<style>
:root { --guide:#FFD700; --g:255,215,0; --poly:polygon(50% 0,100% 100%,50% 72%,0 100%); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:'Helvetica Neue',sans-serif;
       height:100vh; width:100vw; overflow:hidden; }

/* 横向き指示 */
#rotate-screen {
  position:fixed; inset:0; background:#111; z-index:2000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px; text-align:center;
}
#rotate-screen.hidden { display:none; }
.ri { font-size:64px; margin-bottom:20px; animation:sw 1.5s ease-in-out infinite; }
@keyframes sw { 0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(30deg)} }

/* スキップボタン */
#skip-rotate-btn {
  margin-top:20px; padding:10px 22px; font-size:14px;
  background:rgba(255,255,255,0.15); color:#fff;
  border:1px solid rgba(255,255,255,0.4); border-radius:20px; cursor:pointer;
}

/* 権限画面 */
#perm-screen {
  position:fixed; inset:0; background:#111; z-index:1800;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; text-align:center;
}
#perm-screen.hidden { display:none; }
.sbtn {
  margin-top:24px; padding:16px 44px; font-size:18px; font-weight:bold;
  background:#FFD700; color:#000; border:none; border-radius:12px; cursor:pointer;
}

/* ── z-index 設計 ──────────────────────
  5  : AR canvas（障害物描画）
  50 : Rain canvas（雨・霧・全画面、マップのみ除外）
  60 : 上部ナビバー・右下矢印（雨の上に出る）
  100: 左下マップパネル（雨の上に出る）
─────────────────────────────────────── */

/* 全画面 AR キャンバス */
#ar-canvas   { position:fixed; inset:0; z-index:5; }
/* 全画面 豪雨キャンバス */
#rain-canvas { position:fixed; inset:0; z-index:50; pointer-events:none; }

/* ── 上部ナビバー（z=60 雨の上）── */
#top-bar {
  position:fixed; top:var(--bar-top,15vh); left:0; right:0; z-index:60;
  background:rgba(0,0,0,0.30);
  border-bottom:1px solid rgba(255,255,255,0.12);
}
#top-row1 {
  display:flex; align-items:center; padding:8px 14px; gap:10px; height:58px;
}
/* 小型矢印 */
#nav-arrow-outer {
  width:36px; height:36px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 0 3px rgba(var(--g),0.45));
}
#nav-arrow-outer:has(.avoid) { filter:drop-shadow(0 0 3px rgba(255,100,0,0.55)); }
#nav-arrow-small {
  width:22px; height:28px; background:var(--guide); clip-path:var(--poly);
  transition:transform .25s ease-out, background-color .3s;
  transform-origin:center 65%;
}
#nav-arrow-small.avoid { background:#FF6600; }
#nav-msg {
  flex:1; font-size:22px; font-weight:bold;
  white-space:nowrap; overflow:hidden;
  text-shadow:0 0 8px rgba(0,0,0,0.9), 0 1px 3px rgba(0,0,0,1);
}
.msg-safe  { color:#5FE080; }
.msg-avoid { color:#FF6600; }
.msg-wait  { color:rgba(255,255,255,0.5); }
#nav-right { text-align:right; flex-shrink:0; }
#nav-dist-top {
  font-size:24px; font-weight:900; color:#FFF3B0; line-height:1;
  text-shadow:0 1px 2px #000, 0 0 5px #000, 0 0 5px #000;
}
#nav-dist-lbl { font-size:10px; color:rgba(255,255,255,0.85); text-shadow:0 1px 2px rgba(0,0,0,0.9); }

/* 障害物警告行 */
#top-row2 {
  display:flex; align-items:center; padding:4px 14px 7px; gap:10px;
  border-top:1px solid rgba(255,100,0,0.3);
  background:rgba(50,10,0,0.30);
}
#top-row2.hidden { display:none; }
#obs-warn-badge {
  font-size:11px; font-weight:bold; padding:2px 8px;
  border-radius:4px; background:rgba(255,60,0,0.85); white-space:nowrap;
}
#obs-warn-dist {
  font-size:20px; font-weight:900; color:#FF8A3D; min-width:64px;
  text-shadow:0 1px 3px rgba(0,0,0,0.9);
}
#obs-warn-bar-wrap { flex:1; }
#obs-warn-bar-label { font-size:9px; color:rgba(255,255,255,0.85); margin-bottom:2px; text-shadow:0 1px 2px rgba(0,0,0,0.9); }
#obs-warn-bar-track { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
#obs-warn-bar-fill  { height:100%; border-radius:3px; transition:width .4s, background .3s; }
#obs-warn-dir { font-size:11px; color:rgba(255,225,195,0.95); white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,0.9); }

/* ── 左下：マップ（正方形・z=100）── */
#panel-map {
  position:fixed; bottom:0; left:0; z-index:100;
  height:42vh; width:42vh;
  background:rgba(0,14,0,0.92);
  border-top:1px solid rgba(100,200,100,0.3);
  border-right:1px solid rgba(100,200,100,0.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6px;
}
.plbl { font-size:9px; color:rgba(255,255,255,0.25); letter-spacing:1px; margin-bottom:4px; }
#minimap { width:100%; height:100%; max-width:100%; max-height:calc(100% - 20px); border-radius:6px; }
#map-scale { font-size:8px; color:rgba(255,255,255,0.2); margin-top:3px; }

/* ── 右下：矢印のみ（z=60 雨の上）── */
#panel-goal {
  position:fixed; bottom:24px; right:24px; z-index:60;
  display:flex; flex-direction:column; align-items:center;
}
#arrow-wrap {
  width:86px; height:110px;
  display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 0 7px rgba(var(--g),0.45));
}
#arrow-wrap:has(.avoid) { filter:drop-shadow(0 0 7px rgba(255,100,0,0.55)); }
#arrow {
  width:80px; height:100px; background:var(--guide); clip-path:var(--poly);
  transition:transform .25s ease-out, background-color .3s;
  transform-origin:center 65%;
}
#arrow.avoid { background:#FF6600; }

/* 送信情報（右下隅） */
#send-info {
  position:fixed; bottom:6px; right:8px; z-index:60;
  font-size:10px; color:rgba(255,255,255,0.5);
  background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:4px;
}

/* 視界ラベル */
#visibility-note {
  position:fixed; bottom:4px; left:43vh; z-index:60;
  font-size:9px; color:rgba(180,210,255,0.3); letter-spacing:1px; pointer-events:none;
}

/* ===== 実験版で追加 ===== */
body.blank #ar-canvas, body.blank #rain-canvas, body.blank #ground-canvas, body.blank #top-bar, body.blank #panel-map,
body.blank #panel-goal, body.blank #visibility-note, body.blank #avoid-hud, body.blank #map-zoom { visibility:hidden !important; }
#ground-canvas { position:fixed; inset:0; z-index:55; pointer-events:none; }
body[data-phase="idle"] #ground-canvas, body[data-phase="idle"] #avoid-hud, body[data-phase="idle"] #map-zoom { visibility:hidden; }
#avoid-hud { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); z-index:60; min-width:220px; padding:6px 14px 8px;
  background:rgba(0,0,0,0.72); border:1px solid rgba(255,102,0,0.7); border-radius:10px; text-align:center; display:none; pointer-events:none; }
#avoid-hud.show { display:block; }
#avoid-hud.clear { border-color:rgba(95,224,128,0.8); }
#avoid-hud-text { font-size:22px; font-weight:900; color:#FF8A3D; white-space:nowrap; }
#avoid-hud.clear #avoid-hud-text { color:#5FE080; }
#avoid-hud-track { height:6px; margin-top:4px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden; }
#avoid-hud-fill { height:100%; width:0; background:#FF8A3D; border-radius:3px; }
#avoid-hud.clear #avoid-hud-fill { background:#5FE080; }
#map-zoom { position:fixed; left:calc(42vh - 44px); bottom:calc(42vh - 84px); z-index:1250; display:flex; flex-direction:column; gap:6px; }
#map-zoom button { width:38px; height:38px; font-size:22px; color:#fff; background:rgba(40,60,40,0.9); border:1px solid rgba(160,220,160,0.6); border-radius:8px; touch-action:manipulation; }
#send-info, #map-scale { visibility:hidden; } /* 確認用の文字は実験者パネルへ移動 */
body, #exp-panel { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body[data-phase="idle"] #ar-canvas, body[data-phase="idle"] #rain-canvas,
body[data-phase="idle"] #top-bar, body[data-phase="idle"] #panel-map,
body[data-phase="idle"] #panel-goal, body[data-phase="idle"] #visibility-note { visibility:hidden; }
#exp-panel {
  position:fixed; top:0; right:0; bottom:0; width:min(460px,100vw); z-index:1500;
  background:rgba(12,14,18,0.96); color:#eee; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:12px 16px 24px; font-size:14px; line-height:1.5; border-left:1px solid #444;
}
#exp-panel.hidden { display:none; }
#exp-panel h2 { font-size:16px; margin-bottom:8px; }
#exp-panel .row { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
#exp-panel .muted { color:#aaa; font-size:12px; }
#exp-panel select, #exp-panel input[type=number], #exp-panel input[type=text] {
  font-size:16px; padding:6px 8px; background:#222; color:#fff; border:1px solid #666; border-radius:6px;
}
#exp-panel input[type=number] { width:80px; }
#exp-panel input[type=text] { width:100%; -webkit-user-select:text; user-select:text; }
#exp-panel input[type=range] { flex:1; min-width:150px; }
#exp-panel button {
  font-size:15px; padding:10px 14px; background:#333; color:#fff;
  border:1px solid #777; border-radius:8px; cursor:pointer; touch-action:manipulation;
}
#exp-panel button.primary { background:#2F6FED; border-color:#2F6FED; font-weight:bold; }
#exp-panel button.on { background:#2F6FED; border-color:#2F6FED; }
#exp-panel .warn { color:#FFB454; }
#tap-layer { position:fixed; inset:0; z-index:1200; display:none; background:transparent; touch-action:manipulation; }
body[data-phase="discover"] #tap-layer { display:block; }
#corner { position:fixed; top:0; left:0; width:90px; height:90px; z-index:1300; display:none; touch-action:none; }
body[data-phase="discover"] #corner, body[data-phase="walk"] #corner, body[data-phase="free"] #corner { display:block; }
#toast { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:1400; font-size:12px;
  padding:3px 10px; border-radius:10px; background:rgba(0,0,0,.75); color:#fff; display:none; }
</style>
<style id="cond-style"></style>
</head>
<body data-phase="idle">

<!-- 横向き指示 -->
<div id="rotate-screen">
  <div class="ri">📱</div>
  <div style="font-size:22px;font-weight:bold;margin-bottom:12px;">スマートフォンを横向きに</div>
  <div style="font-size:13px;color:rgba(255,255,255,0.6);line-height:1.8;">

<script type="module">

const firebaseConfig = {
  apiKey:"AIzaSyBG-JwC9VKwnSHaSkvGLzNLvXtvZ3U0q6M",
  authDomain:"heavy-rain-evacuation.firebaseapp.com",
  projectId:"heavy-rain-evacuation",
  storageBucket:"heavy-rain-evacuation.firebasestorage.app",
  appId:"1:405482442865:web:99c4a046167821b4abcbd0"
};
let db=null, doc=null, setDoc=null, serverTimestamp=null, dbError='';
(async()=>{
  try{
    const a=await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
    const f=await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    db=f.getFirestore(a.initializeApp(firebaseConfig));
    doc=f.doc; setDoc=f.setDoc; serverTimestamp=f.serverTimestamp;
  }catch(e){ dbError='Firebase読込失敗'; console.error(e); }
})();

/* ===== 実験の設定（ここを変えるとデザインの組み合わせが変わる） =====
   URLの ?conds=base,red,green でも指定できる。5条件なら順序は10通りになる。 */
const DEFAULT_CONDS=['base','white','green','triangle','chevron','bigarrow'];

const color=(hex,rgb)=>`:root{--guide:${hex};--g:${rgb};}`;
const shape=(poly)=>`:root{--poly:polygon(${poly});}`;
const CONDITIONS={
  base:{side:1,label:'基準（黄・ルート線・➤・22px）',css:''},
  red:{label:'赤',guide:'#FF4D4D',css:color('#FF4D4D','255,77,77')},
  green:{side:1,label:'色変更（蛍光緑）',guide:'#39FF14',css:color('#39FF14','57,255,20')},
  white:{side:-1,label:'色変更（白）',guide:'#F2F2F2',css:color('#F2F2F2','242,242,242')},
  bigarrow:{side:-1,label:'大きい矢印（1.5倍）',css:`#arrow-wrap{width:129px;height:165px;}
#arrow{width:120px;height:150px;}
#panel-goal{right:36px;}`},
  layout:{label:'配置変更',css:`#top-bar{display:flex;align-items:center;padding:8px 14px;gap:10px;height:58px;}
#top-row1{display:contents;padding:0;height:auto;gap:normal;}
#nav-msg{order:2;min-width:0;}
#top-row2{order:3;display:flex;align-items:center;padding:4px 10px;gap:10px;flex:0 1 auto;min-width:0;border:1px solid rgba(255,100,0,0.3);border-radius:6px;}
#nav-right{order:4;}
#obs-warn-bar-wrap{flex:1;min-width:80px;overflow:hidden;}
#obs-warn-bar-label{font-size:9px;color:rgba(255,255,255,0.3);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#panel-goal{top:50%;bottom:auto;right:24px;transform:translateY(-50%);}`},
  shaftarrow:{label:'→型',css:shape('50% 0,100% 45%,71% 45%,71% 100%,29% 100%,29% 45%,0 45%')},
  chevron:{side:-1,label:'ルート線＞＞（矢印なし）',ground:'chevron',css:`#panel-goal{visibility:hidden;}
#nav-arrow-outer{visibility:hidden;}`},
  triangle:{side:1,label:'三角形',css:shape('50% 0,100% 100%,0 100%')},
};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const params=new URLSearchParams(location.search);
const expConds=(()=>{
  const q=(params.get('conds')||'').split(',').filter(c=>CONDITIONS[c]);
  return (q.length>=2&&new Set(q).size===q.length)?q:DEFAULT_CONDS;
})();

/* Williams型の順序：各条件が各順番に同数、直前の条件も均等になる。
   条件数が奇数のときは逆順も加えて 2n 通りにする。 */
function williams(n){
  const first=[0];
  for(let lo=1,hi=n-1;lo<=hi;){ first.push(lo++); if(lo<=hi) first.push(hi--); }
  const rows=[];
  for(let i=0;i<n;i++) rows.push(first.map(x=>(x+i)%n));
  if(n%2) rows.slice().forEach(r=>rows.push(r.slice().reverse()));
  return rows;
}
const ORDERS=williams(expConds.length);

function setCondition(id){
  document.getElementById('cond-style').textContent=CONDITIONS[id].css;
  exp.cond=id;
}
const exp={
  phase:'idle',cond:'base',pid:null,group:'S',num:1,pattern:0,order:[],trial:0,rec:null,
  fog:Math.max(0,Math.min(100,Number(params.get('fog')??90))),
  rain:Math.max(0,Math.min(100,Number(params.get('rain')??70))),
  barTop:15,
  gpsMode:(params.get('gps')||store.get('exp2_gps','predict'))==='raw'?'raw':'predict',
};
function setPhase(p){exp.phase=p;document.body.dataset.phase=p;}
const fogK=()=>exp.fog/100;
let mapZoom=1;
const applyBar=()=>document.documentElement.style.setProperty('--bar-top',exp.barTop+'vh');

// ★ 実験設定
let GOAL={lat:36.1085084,lng:139.3630287,name:"ゴール地点★"};
let OBSTACLES=[
  {lat:36.1094372,lng:139.3648114,radiusM:3.0,name:"障害物",widthM:1.0,depthM:1.0,heightM:1.0,rotationDeg:0},
];
const AREA=[[36.110889,139.360278],[36.110306,139.367194],[36.105889,139.365111],[36.106222,139.357861]];

// ★ 豪雨・視界設定
const RAIN={drops:280,speed:18,angle:20,fogOpa:0.17,visM:5.0};
const OBS_SHOW=15.0;
const AR_FOV=46;

let myLat=null,myLng=null,deviceHeading=0,animFrame=0;

/* ===== 固定ルート =====
   現地で登録した地点を結んだ線を案内する（広場は地図の歩道データでは赤線どおりに案内できない）。
   優先順位：URLの ?route=緯度,経度;緯度,経度...&obs=緯度,経度 → 端末内の保存 */
const parsePts=t=>(t||'').split(';').map(p=>p.split(',').map(Number)).filter(p=>p.length===2&&p.every(Number.isFinite));
// 実験ルート（順方向の順。逆方向はこの逆順）
// 36°06'29.7"N 139°21'47.2"E → 36°06'29.7"N 139°21'48.0"E → 36°06'30.1"N 139°21'48.0"E → 36°06'30.0"N 139°21'49.1"E
const dms=(d,m,s)=>+(d+m/60+s/3600).toFixed(7);
const BUILTIN_ROUTE=[
  [dms(36,6,29.7),dms(139,21,47.2)],
  [dms(36,6,29.7),dms(139,21,48.0)],
  [dms(36,6,30.1),dms(139,21,48.0)],
  [dms(36,6,30.0),dms(139,21,49.1)],
];
const routeCfg=(()=>{
  const q=parsePts(params.get('route'));
  if(q.length>=2){const o=parsePts(params.get('obs'));return {points:q,obs:o[0]||null};}
  const s=store.get('exp2_routecfg2',null);
  return (s&&Array.isArray(s.points))?{points:s.points,obs:s.obs||null}:{points:BUILTIN_ROUTE.map(p=>[...p]),obs:null};
})();
function saveRouteCfg(){store.set('exp2_routecfg2',routeCfg);}
const altDirection=params.get('alt')!=='0';
// 奇数番目は順向き、偶数番目は逆向き（?alt=0 で常に順向き）
const trialReverse=i=>altDirection&&i%2===1;

let routeCoords=[];        // 1mごとの点 [[緯度,経度],...]
let routeDistanceM=0;
let progressIdx=-1, obsIdx=0;
const SNAP_MAX=2;   // ルートからこの距離（m）以内なら、GPSのずれとみなして補正する

function legM(a,b){const k=Math.cos(a[0]*Math.PI/180);return Math.hypot((b[0]-a[0])*111320,(b[1]-a[1])*111320*k);}
function routeLength(P){let d=0;for(let i=1;i<P.length;i++)d+=legM(P[i-1],P[i]);return d;}
function obstaclePoint(){
  if(routeCfg.obs)return routeCfg.obs;
  const P=routeCfg.points;if(P.length<2)return null;
  let best=1,m=-1;for(let i=1;i<P.length;i++){const d=legM(P[i-1],P[i]);if(d>m){m=d;best=i;}}
  return [(P[best-1][0]+P[best][0])/2,(P[best-1][1]+P[best][1])/2];
}
/* 障害物を避ける回り道をルートに組み込む。
   よける方向は条件ごとに、歩く人から見た右（1）または左（-1）で決める。 */
const DETOUR_LAT=3.9, DETOUR_IN=6, DETOUR_FLAT=2.5;
let axisE=0, axisN=1, obsSide=0;
// 偶数番号の参加者は左右を入れ替える
const condSide=()=>(CONDITIONS[exp.cond].side||1)*(exp.sideFlip?-1:1);
function withDetour(P,o,side){
  let best=-1,bd=Infinity,tb=0;
  const k=Math.cos(o[0]*Math.PI/180);
  for(let i=1;i<P.length;i++){
    const ax=(P[i][1]-P[i-1][1])*111320*k, ay=(P[i][0]-P[i-1][0])*111320, l2=ax*ax+ay*ay||1;
    const ox=(o[1]-P[i-1][1])*111320*k, oy=(o[0]-P[i-1][0])*111320;
    const t=Math.max(0,Math.min(1,(ox*ax+oy*ay)/l2));
    const d=Math.hypot(ox-ax*t,oy-ay*t);
    if(d<bd){bd=d;best=i;tb=t;}
  }
  const A=P[best-1],B=P[best];
  const ax=(B[1]-A[1])*111320*k, ay=(B[0]-A[0])*111320, L=Math.hypot(ax,ay)||1;
  const uE=ax/L,uN=ay/L;
  const along=tb*L, inLen=Math.min(DETOUR_IN,along-0.5,L-along-0.5), flat=Math.min(DETOUR_FLAT,inLen*0.5);
  const pt=(s,lat)=>{ // s:障害物からの前後、lat:右向きの距離
    const e=(o[1]-A[1])*111320*k-(uE*((o[1]-A[1])*111320*k)+uN*((o[0]-A[0])*111320))*uE;
    const n=(o[0]-A[0])*111320-(uE*((o[1]-A[1])*111320*k)+uN*((o[0]-A[0])*111320))*uN;
    const E=e+uE*(along+s)+uN*lat, N=n+uN*(along+s)-uE*lat;
    return [A[0]+N/111320,A[1]+E/(111320*k)];
  };
  // 順方向の並びに、回り道の4点を挿入
  const out=[...P.slice(0,best),pt(-inLen,0),pt(-flat,DETOUR_LAT*side),pt(flat,DETOUR_LAT*side),pt(inLen,0),...P.slice(best)];
  return {out,uE,uN};
}
function applyRoute(reverse){
  progressIdx=-1;
  if(routeCfg.points.length<2){routeCoords=[];routeDistanceM=0;return;}
  const o=obstaclePoint();
  const walkerSide=condSide();
  const d=withDetour(routeCfg.points,o,reverse?-walkerSide:walkerSide);
  const P=reverse?[...d.out].reverse():d.out;
  axisE=reverse?-d.uE:d.uE; axisN=reverse?-d.uN:d.uN; obsSide=walkerSide;
  const out=[P[0]];
  for(let i=1;i<P.length;i++){
    const n=Math.max(1,Math.round(legM(P[i-1],P[i])));
    for(let k=1;k<=n;k++)out.push([P[i-1][0]+(P[i][0]-P[i-1][0])*k/n,P[i-1][1]+(P[i][1]-P[i-1][1])*k/n]);
  }
  routeCoords=out;routeDistanceM=routeLength(P);
  const g=P[P.length-1];GOAL={lat:g[0],lng:g[1],name:'ゴール地点★'};
  OBSTACLES[0].lat=o[0];OBSTACLES[0].lng=o[1];
  let bd=Infinity;out.forEach((q,i)=>{const m=legM(q,o);if(m<bd){bd=m;obsIdx=i;}});
}
function routeLink(){
  const f=p=>p.join(',');
  let u=location.origin+location.pathname+'?route='+routeCfg.points.map(f).join(';');
  if(routeCfg.obs)u+='&obs='+f(routeCfg.obs);
  return u;
}
applyRoute(false);

/* ===== ルート上の現在位置・次の進行方向 =====
   GPSのぶれで先の区間へ飛ばないよう、前回の位置の近くだけを探す */
function getRouteProgress(){
  if(routeCoords.length<2||myLat===null)return null;
  const near=(from,to)=>{
    let bi=from,bd=Infinity;
    for(let i=from;i<=to;i++){const d=dist(myLat,myLng,routeCoords[i][0],routeCoords[i][1]);if(d<bd){bd=d;bi=i;}}
    return [bi,bd];
  };
  const last=routeCoords.length-1;
  let [idx,d]=progressIdx<0?near(0,last)
    :near(Math.max(0,progressIdx-3),Math.min(last,progressIdx+12));
  if(d>15)[idx,d]=near(0,last);   // 大きく外れたら全体から探し直す
  progressIdx=idx;
  const kk=Math.cos(myLat*Math.PI/180);
  // GPSの誤差で横にずれていても、ルート線と矢印が足元から始まるよう補正する。
  // 補正は最大 SNAP_MAX m まで。それ以上ずれた分はそのまま残り、ルートへ戻る向きに表示される
  // （境目で表示が急に跳ばないよう、補正量を上限で頭打ちにする）。
  let offN=(myLat-routeCoords[idx][0])*111320, offE=(myLng-routeCoords[idx][1])*111320*kk;
  const om=Math.hypot(offN,offE), snapped=om<=SNAP_MAX;
  if(om>SNAP_MAX){offN*=SNAP_MAX/om;offE*=SNAP_MAX/om;}
  const ti=Math.min(last,idx+5), a0=Math.min(idx,last-1), t0=routeCoords[a0], t1=routeCoords[Math.max(ti,a0+1)];
  const tangent=bear(t0[0],t0[1],t1[0],t1[1]);
  const target=routeCoords[ti];
  const tLat=target[0]+offN/111320, tLng=target[1]+offE/(111320*kk);
  return {
    remaining:(routeCoords.length-1-idx)*(routeDistanceM/last)+d,
    bearing:(dist(myLat,myLng,tLat,tLng)<0.5?tangent:bear(myLat,myLng,tLat,tLng)),
    tangent, snapped, offN, offE, idx
  };
}
// 表示用のルート：現在地から先の n m 分を、足元からの位置に補正して返す
function displayRoute(n){
  const pr=getRouteProgress(); if(!pr) return [];
  const kk=Math.cos(myLat*Math.PI/180);
  return routeCoords.slice(pr.idx,pr.idx+n).map(p=>[p[0]+pr.offN/111320,p[1]+pr.offE/(111320*kk)]);

}

// ===== 雨粒 =====
class Drop {
  constructor(W,H,init=false){this.W=W;this.H=H;this.reset(init);}
  reset(init=false){
    this.x=Math.random()*(this.W+200)-100;
    this.y=init?Math.random()*this.H:-60;
    this.len=15+Math.random()*25; this.spd=RAIN.speed*(0.7+Math.random()*0.6);
    this.opa=0.35+Math.random()*0.45; this.w=0.5+Math.random()*1.2;
    if(Math.random()<0.3){this.len*=0.5;this.w*=0.6;this.opa*=0.5;}
  }
  update(){const r=RAIN.angle*Math.PI/180;this.x+=Math.sin(r)*this.spd;this.y+=Math.cos(r)*this.spd;if(this.y>this.H+60||this.x>this.W+100)this.reset();}
  draw(ctx){
    const r=RAIN.angle*Math.PI/180;
    ctx.beginPath();ctx.moveTo(this.x,this.y);
    ctx.lineTo(this.x+Math.sin(r)*this.len,this.y+Math.cos(r)*this.len);
    ctx.strokeStyle=`rgba(180,210,255,${this.opa})`;ctx.lineWidth=this.w;ctx.stroke();
  }
}
let drops=[];

function initRain(){
  rainC.width=window.innerWidth;rainC.height=window.innerHeight;
  drops=[];for(let i=0;i<RAIN.drops;i++)drops.push(new Drop(rainC.width,rainC.height,true));
}

// ===== 豪雨描画 =====
function drawRain(){
  const W=rainC.width,H=rainC.height;
  rainX.clearRect(0,0,W,H);
  rainX.fillStyle=`rgba(160,185,210,${RAIN.fogOpa*fogK()})`;rainX.fillRect(0,0,W,H);
  const gf=rainX.createLinearGradient(0,H*0.55,0,H);
  gf.addColorStop(0,'rgba(180,200,225,0)');gf.addColorStop(1,`rgba(180,200,225,${0.4*fogK()})`);
  rainX.fillStyle=gf;rainX.fillRect(0,0,W,H);
  rainX.save();rainX.lineCap='round';
  const nDrops=Math.round(drops.length*exp.rain/100);rainX.globalAlpha=Math.min(1,0.4+exp.rain/100);for(let i=0;i<nDrops;i++){drops[i].update();drops[i].draw(rainX);}rainX.globalAlpha=1;
  rainX.restore();
}

// ===== AR障害物描画 =====
function drawAR(){
  const W=arC.width,H=arC.height;
  arX.clearRect(0,0,W,H);
  arX.fillStyle=`rgba(165,190,215,${0.52*fogK()})`;arX.fillRect(0,0,W,H);
  const gf2=arX.createLinearGradient(0,H*0.5,0,H);
  gf2.addColorStop(0,'rgba(178,200,225,0)');
  gf2.addColorStop(1,`rgba(178,200,225,${0.65*fogK()})`);
  arX.fillStyle=gf2;arX.fillRect(0,0,W,H);
  if(myLat===null || myLng===null)return;

  const ob=nearest();
  // 障害物の外周まで OBS_SHOW(15m) 以内なら、向きに関係なく表示対象にする
  // （雨の視界は5mのまま。5m超はARが先に知らせる距離として、遠いほど薄く表示）
  // 通過したら障害物と距離の表示を消す
  if(ob&&obstacleState(ob).passed) return;
  if(!ob || ob.d>OBS_SHOW){
    arX.fillStyle='rgba(200,220,240,0.2)';
    arX.font='12px sans-serif';
    arX.textAlign='center';
    arX.fillText('障害物まで '+(ob?ob.d.toFixed(1)+'m':'距離不明'),W/2,H*0.52);
    return;
  }

  // 5m以内: 従来どおり / 5〜15m: 0.25→0.18 へ連続的に薄くする
  const clarity=ob.d<=5 ? Math.max(0.25,Math.min(1,1-ob.d/5))
                        : Math.max(0.18,0.25-0.007*(ob.d-5));
  const bearingToCenter=bear(myLat,myLng,ob.lat,ob.lng);
  const relB=((bearingToCenter-deviceHeading+orientOfs()+540)%360)-180;
  const ppd=W/AR_FOV;
  arX.strokeStyle=`rgba(100,140,180,${0.07*clarity})`;
  arX.lineWidth=1;arX.setLineDash([4,8]);
  arX.beginPath();arX.moveTo(0,H*0.52);arX.lineTo(W,H*0.52);arX.stroke();arX.setLineDash([]);

  // 画面内外を問わず、従来と同じく障害物の表示位置を画面内に収める
  const topH=document.getElementById('top-bar').offsetHeight||60;
  const botH=window.innerHeight*0.45;
  // 障害物全体を画面の下側へ移動（向き・距離・立体形状の計算は変更しない）
  const obRF=relRF(ob.lat,ob.lng);
  const obP=project(Math.max(-1,obRF.right),Math.max(0,obRF.forward));
  const groundY=Math.min(H*0.96,project(0,Math.max(0,obRF.forward)).y);
  const rawXC=obRF.forward>0.5?W/2+groundF()*obRF.right/(obRF.forward+GROUND.zOfs):W/2+relB*ppd;
  const markerW=Math.max(44,Math.min(W*0.55, W/AR_FOV*12));
  const xC=Math.max(markerW/2+8,Math.min(W-markerW/2-8,rawXC));
  const isClamped=Math.abs(xC-rawXC)>1;
  const isClose=ob.d<=ob.radiusM, isNear=ob.d<=OBS_SHOW/2;
  const alpha=Math.min(0.95,0.5+0.45*(1-ob.d/OBS_SHOW))*clarity;
  const faceColor=isClose?`rgba(255,35,35,${alpha})`:isNear?`rgba(255,105,0,${alpha})`:`rgba(255,195,0,${alpha*0.82})`;
  const topColor=isClose?`rgba(255,75,75,${alpha})`:isNear?`rgba(255,155,35,${alpha})`:`rgba(255,225,100,${alpha})`;
  const sideColor=isClose?`rgba(155,0,0,${alpha})`:isNear?`rgba(170,55,0,${alpha})`:`rgba(175,115,0,${alpha*0.9})`;
  const lineColor=isClose?`rgba(255,95,95,${clarity})`:isNear?`rgba(255,170,70,${clarity})`:`rgba(255,230,130,${clarity})`;

  // 立方体の大きさを距離に応じて調整。width/depthは地面上の寸法、heightは高さ。
  const centerD=Math.max(0.8,ob.centerD||ob.d||1);
  const focal=W/(2*Math.tan((AR_FOV*Math.PI/180)/2));
  const scale=Math.max(18,Math.min(groundF()*GROUND.camH/(centerD+GROUND.zOfs), W*0.12));
  const sizeX=(ob.widthM||2)/2, sizeY=(ob.depthM||2)/2, sizeZ=(ob.heightM||2);
  const boxRot=(ob.rotationDeg||0)*Math.PI/180;
  const heading=(deviceHeading-orientOfs())*Math.PI/180;
  const ch=Math.cos(heading), sh=Math.sin(heading);
  const cr=Math.cos(boxRot), sr=Math.sin(boxRot);

  // 立方体の8頂点を、障害物の向きと端末の向きに応じて画面座標へ投影
  const verts=[];
  for(let z=0;z<=1;z++){
    for(let iy=0;iy<2;iy++){
      for(let ix=0;ix<2;ix++){
        const lx=ix?sizeX:-sizeX, ly=iy?sizeY:-sizeY;
        const east=lx*cr-ly*sr;
        const north=lx*sr+ly*cr;
        const right=east*ch-north*sh;
        const forward=east*sh+north*ch;
        // 奥行き方向のずれも反映し、上面に立体感を持たせる
        const perspective=scale*(1-Math.max(-0.45,Math.min(0.45,forward/Math.max(centerD,1))*0.22));
        verts.push({x:xC+right*perspective,y:groundY-z*sizeZ*scale+forward*scale*0.18,id:`${ix}${iy}${z}`,east,north,z});
      }
    }
  }
  const V={
    '000':verts.find(v=>v.id==='000'),'100':verts.find(v=>v.id==='100'),
    '010':verts.find(v=>v.id==='010'),'110':verts.find(v=>v.id==='110'),
    '001':verts.find(v=>v.id==='001'),'101':verts.find(v=>v.id==='101'),
    '011':verts.find(v=>v.id==='011'),'111':verts.find(v=>v.id==='111')
  };
  const viewerBearing=bear(ob.lat,ob.lng,myLat,myLng)*Math.PI/180;
  const viewEast=Math.sin(viewerBearing), viewNorth=Math.cos(viewerBearing);
  // 見る位置に応じて手前にある面を選び、面の色も変えて立体感を出す
  const faces=[
    {ids:['001','101','111','011'],color:topColor,normal:[0,0,1],depth:1},
    {ids:['000','010','011','001'],color:sideColor,normal:[-cr,-sr,0],depth:viewEast*(-cr)+viewNorth*(-sr)},
    {ids:['100','110','111','101'],color:sideColor,normal:[cr,sr,0],depth:viewEast*cr+viewNorth*sr},
    {ids:['000','100','101','001'],color:faceColor,normal:[-sr,cr,0],depth:viewEast*(-sr)+viewNorth*cr},
    {ids:['010','110','111','011'],color:faceColor,normal:[sr,-cr,0],depth:viewEast*sr+viewNorth*(-cr)}
  ];
  // 奥側から描画し、手前の面が自然に重なるようにする
  faces.sort((a,b)=>a.depth-b.depth);
  faces.forEach(face=>{
    // 上面は常に描画。側面はユーザー側を向いている面だけを描画する。
    if(face.ids[0]!=='001' && face.depth < -0.05)return;
    arX.beginPath();
    face.ids.forEach((id,i)=>{const v=V[id];if(i===0)arX.moveTo(v.x,v.y);else arX.lineTo(v.x,v.y);});
    arX.closePath();arX.fillStyle=face.color;arX.fill();
    arX.strokeStyle=lineColor;arX.lineWidth=isClose?3:2;arX.stroke();
  });

  // 足元の影と警告ガイドは従来の役割を維持
  arX.beginPath();arX.ellipse(xC,groundY,Math.max(16,sizeX*scale),7*Math.max(0.3,1-ob.d/12),0,0,Math.PI*2);
  arX.fillStyle=`rgba(255,60,0,${0.18*clarity})`;arX.fill();
  arX.strokeStyle=`rgba(255,120,0,${0.22*clarity})`;arX.lineWidth=1;arX.setLineDash([3,4]);
  arX.beginPath();arX.moveTo(xC,groundY);arX.lineTo(xC,groundY-sizeZ*scale);arX.stroke();arX.setLineDash([]);

  const topY=Math.min(V['001'].y,V['101'].y,V['011'].y,V['111'].y);
  if(isClose&&animFrame%20<10){arX.fillStyle=`rgba(255,40,40,${0.95*clarity})`;arX.font='bold 22px sans-serif';arX.textAlign='center';arX.fillText('⚠',xC,topY-24);}
  if(clarity>0.2 || ob.d>5){
    const labA=ob.d>5?0.6:clarity;  // 遠距離でも距離ラベルは読めるようにする
    arX.fillStyle=`rgba(0,0,0,${0.55*labA})`;
    arX.beginPath();arX.roundRect(xC-58,topY-34,116,26,5);arX.fill();
    arX.fillStyle=`rgba(255,255,255,${labA})`;arX.font='bold 13px sans-serif';arX.textAlign='center';
    arX.fillText(ob.name+'  '+ob.d.toFixed(0)+'m',xC,topY-16);
  }
  if(isClamped){
    arX.fillStyle=`rgba(255,120,0,${Math.max(0.65,clarity)})`;
    arX.font='bold 18px sans-serif';arX.textAlign='center';
    arX.fillText(rawXC<xC?'◀':'▶',rawXC<xC?16:W-16,H/2);
  }
}

// ===== ナビ更新：徒歩ルートがあればルートに沿って案内 =====
function updateNav(){
  if(myLat===null || myLng===null) return;
  const ob=nearest(), ofs=orientOfs();
  const arrowEl=document.getElementById('nav-arrow-small');
  const bigArrow=document.getElementById('arrow');
  const st=obstacleState(ob);
  if(exp.rec&&ob) exp.rec.minObsM=Math.min(exp.rec.minObsM??Infinity,ob.d);
  const hud=document.getElementById('avoid-hud');
  hud.className=(st.phase==='avoid'?'show':st.phase==='clear'?'show clear':'');
  if(st.phase==='avoid'||st.phase==='clear'){
    const sideName=st.side>0?'右':'左';
    elSet('avoid-hud-text',st.phase==='clear'?'回避OK ルートに沿って':sideName+'へ あと '+st.need.toFixed(1)+'m');
    document.getElementById('avoid-hud-fill').style.width=(st.phase==='clear'?100:Math.max(0,Math.min(100,(1-st.need/st.total)*100)))+'%';
  }
  if(st.phase==='avoid'){
    const prA=getRouteProgress();
    const ang=(prA?prA.bearing:bear(myLat,myLng,GOAL.lat,GOAL.lng))-deviceHeading+ofs;
    arrowEl.style.transform='rotate('+ang+'deg)';
    arrowEl.className='avoid';
    bigArrow.style.transform='rotate('+ang+'deg)';
    bigArrow.className='avoid';
    elSet('nav-msg','⚠️ '+ob.name+'に接近！'+sideName2(st.side)+'へ回避してください','msg-avoid');
    elSet('nav-dist-top',''); elSet('nav-dist-lbl','');
  } else if(st.phase==='clear'){
    const prC=getRouteProgress();
    const ang=(prC?prC.bearing:bear(myLat,myLng,GOAL.lat,GOAL.lng))-deviceHeading+ofs;
    arrowEl.style.transform='rotate('+ang+'deg)'; arrowEl.className='';
    bigArrow.style.transform='rotate('+ang+'deg)'; bigArrow.className='';
    elSet('nav-msg','回避できました。ルートに沿って進んでください','msg-safe');
    const pr=getRouteProgress();
    elSet('nav-dist-top',pr?Math.round(pr.remaining):''); elSet('nav-dist-lbl','ルート残り(m)');
  } else {
    const progress=getRouteProgress();
    if(progress){
      const ang=progress.bearing-deviceHeading+ofs;
      arrowEl.style.transform='rotate('+ang+'deg)'; arrowEl.className='';
      bigArrow.style.transform='rotate('+ang+'deg)'; bigArrow.className='';
      const arrived=progress.remaining<=4;
      if(arrived&&exp.rec&&exp.phase==='walk'&&exp.rec.arrivalMs==null&&exp.t1) exp.rec.arrivalMs=Math.round(performance.now()-exp.t1);
      elSet('nav-msg',arrived?'ゴール付近です':'ルートに沿って進んでください','msg-safe');
      elSet('nav-dist-top',Math.round(progress.remaining));
      elSet('nav-dist-lbl','ルート残り(m)');
    } else {
      const dg=dist(myLat,myLng,GOAL.lat,GOAL.lng);
      const ang=bear(myLat,myLng,GOAL.lat,GOAL.lng)-deviceHeading+ofs;

    const dirs=['正面','右前方','右側','右後方','後方','左後方','左側','左前方'];
    const dname=dirs[Math.round(((relB+360)%360)/45)%8];

  } else row2.classList.add('hidden');

// ===== ミニマップの背景地図 =====
// OpenStreetMapのタイルを、現在地を中心・北を上にして縮尺を合わせて描く。
// ARグラスでまぶしくならないよう暗めに表示する。
const tileCache=new Map();
function drawMapTiles(sc,cx,cy,W,H){
  const z=sc*0.3>=1?19:18;                       // 1px あたりの細かさに合わせてズームを選ぶ
  const n=Math.pow(2,z), mpp=156543.03*Math.cos(myLat*Math.PI/180)/n;
  const k=sc*111000/111320*mpp;                  // タイル1pxがマップ上で何pxか（gps2pxと同じ係数）
  const wx=(myLng+180)/360*n*256;
  const r=myLat*Math.PI/180, wy=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256;
  const x0=Math.floor((wx-cx/k)/256), x1=Math.floor((wx+(W-cx)/k)/256);
  const y0=Math.floor((wy-cy/k)/256), y1=Math.floor((wy+(H-cy)/k)/256);
  if((x1-x0+1)*(y1-y0+1)>36) return;
  mapX.save();mapX.globalAlpha=0.55;
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    const key=z+'/'+x+'/'+y;
    let im=tileCache.get(key);
    if(!im){im=new Image();im.src='https://tile.openstreetmap.org/'+key+'.png';tileCache.set(key,im);}
    if(im.complete&&im.naturalWidth) mapX.drawImage(im,cx+(x*256-wx)*k,cy+(y*256-wy)*k,256*k+1,256*k+1);
  }
  mapX.restore();
  mapX.fillStyle='rgba(0,10,0,0.35)';mapX.fillRect(0,0,W,H);   // 線や記号が見えるよう少し暗くする
  mapX.fillStyle='rgba(255,255,255,0.55)';mapX.font='13px sans-serif';mapX.textAlign='right';
  mapX.fillText('© OpenStreetMap',W-6,H-6);
}

function isLand(){
  if (window.innerWidth > window.innerHeight) return true;
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  return a === 90 || a === 270 || a === -90;
}
function orientOfs(){
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  if(a===90) return -90;
  if(a===270 || a===-90) return 90;
  return 0;
}
function checkOrient(){
  const land = isLand();
  const rot = document.getElementById('rotate-screen');
  const perm = document.getElementById('perm-screen');
  
  if (land) {
    rot.classList.add('hidden');
    if (!document.body.dataset.started) perm.classList.remove('hidden');
  } else {
    if (!document.body.dataset.started) {
      rot.classList.remove('hidden');
      perm.classList.add('hidden');
    }
  }
}

// ===== GPS & Firebase =====
/* GPSはページを開いている間ずっと動かし続ける（デザイン切替で取り直さない）。
   iPhoneのブラウザの更新はおおむね1秒に1回で、コードでは増やせないため、
   次の測位までの間は直近の移動から現在地を推定して表示の遅れを小さくする。 */
const gps={lat:null,lng:null,vE:0,vN:0,t:0,acc:null,last:0,intervals:[],fixes:0,error:''};
const M_LAT=111320, mLng=()=>111320*Math.cos(GOAL.lat*Math.PI/180);
function onFix(pos){
  const now=performance.now(), rawLat=pos.coords.latitude, rawLng=pos.coords.longitude;
  gps.acc=pos.coords.accuracy; gps.fixes++; gps.error=''; gps.rawLat=rawLat; gps.rawLng=rawLng;
  const dt=gps.t?(now-gps.t)/1000:0;
  if(gps.t){gps.intervals.push(now-gps.t); if(gps.intervals.length>30)gps.intervals.shift();}
  if(exp.rec&&(exp.phase==='walk'||exp.phase==='discover')){
    exp.rec.gpsFixes++; exp.rec.accSum+=gps.acc;
    if(gps.t) exp.rec.intervals.push(now-gps.t);
    exp.rec.track.push({t:Math.round(now-exp.t0),lat:+rawLat.toFixed(7),lng:+rawLng.toFixed(7),acc:Math.round(gps.acc*10)/10});
  }
  if(gps.lat===null||dt<=0||dt>3||exp.gpsMode==='raw'){
    gps.lat=rawLat;gps.lng=rawLng;gps.vE=0;gps.vN=0;
  }else{
    // α-βフィルタ：予測位置と測位結果を混ぜ、速度も少しずつ更新する
    const pE=gps.vE*dt, pN=gps.vN*dt;
    const rE=(rawLng-gps.lng)*mLng()-pE, rN=(rawLat-gps.lat)*M_LAT-pN;
    gps.lng+=(pE+0.6*rE)/mLng(); gps.lat+=(pN+0.6*rN)/M_LAT;
    gps.vE+=0.2*rE/dt; gps.vN+=0.2*rN/dt;
    const sp=Math.hypot(gps.vE,gps.vN);
    if(sp>2.5){gps.vE*=2.5/sp;gps.vN*=2.5/sp;}
    if(sp<0.25){gps.vE=0;gps.vN=0;}   // 静止時に位置が流れないようにする
  }
  gps.t=now;
  tickPosition();
  sendFire(rawLat,rawLng);
  updateNav();
}
function tickPosition(){
  if(gps.lat===null)return;
  const el=exp.gpsMode==='predict'?Math.min(1.5,(performance.now()-gps.t)/1000):0;
  myLat=gps.lat+gps.vN*el/M_LAT;
  myLng=gps.lng+gps.vE*el/mLng();
}
function startGPS(){
  navigator.geolocation.watchPosition(onFix,(err)=>{
    gps.error='GPSエラー: '+err.code;
  },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};
async function keepAwake(){
  const req=async()=>{try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}};
  req(); document.addEventListener('visibilitychange',()=>{if(!document.hidden)req();});
}

let lastSend=0, dbStatus='待機中';
async function sendFire(lat, lng) {
  // ★ エリア外判定をスキップ（どこからでも確実に送信）
  if(!db) return;
  if(Date.now()-lastSend<1000) return;
  lastSend=Date.now();
  try {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');

    // ① コレクション名：年月日（例: 20261013）
    const dateCol = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;

    // ② ドキュメント名：時分秒-端末ID（例: 153045-u1a2b3c）
    const timeDoc = `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}-${deviceId}`;

    await setDoc(doc(db, dateCol, timeDoc), {
      lat,
      lng,
      timestamp: serverTimestamp(),
      deviceId,
      pid: exp.pid, cond: exp.cond, trial: exp.trial+1, phase: exp.phase, accuracy: gps.acc
    });

    dbStatus='送信OK '+now.toLocaleTimeString('ja-JP');
  } catch (e) {
    console.error('Firebase送信エラー:', e);
    dbStatus='DBエラー: '+(e.code||e.message);
  }
}

// ===== ユーティリティ =====
function gps2px(lat,lng,sc,cx,cy){const dLat=lat-myLat,dLng=lng-myLng;return{x:cx+dLng*111000*Math.cos(myLat*Math.PI/180)*sc,y:cy-dLat*111000*sc};}

// 四角形の四隅を緯度・経度で計算
function obstacleCorners(ob){
  const a=(ob.rotationDeg||0)*Math.PI/180;
  const hx=(ob.widthM||2)/2, hy=(ob.depthM||2)/2;
  const c=Math.cos(a), s=Math.sin(a);
  return [[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].map(([x,y])=>{
    const east=x*c-y*s;
    const north=x*s+y*c;
    return [
      ob.lat+north/111320,
      ob.lng+east/(111320*Math.cos(ob.lat*Math.PI/180))
    ];
  });
}

// GPS位置から四角形の外周までの最短距離と最寄り点を計算
function obstacleMetrics(lat,lng,ob){
  const cosLat=Math.cos(ob.lat*Math.PI/180);
  const east=(lng-ob.lng)*111320*cosLat;
  const north=(lat-ob.lat)*111320;
  const a=(ob.rotationDeg||0)*Math.PI/180;
  const c=Math.cos(a), s=Math.sin(a);
  const x=east*c+north*s;
  const y=-east*s+north*c;
  const hx=(ob.widthM||2)/2, hy=(ob.depthM||2)/2;
  const inside=Math.abs(x)<=hx && Math.abs(y)<=hy;
  let qx=Math.max(-hx,Math.min(hx,x));
  let qy=Math.max(-hy,Math.min(hy,y));
  if(inside){
    const edges=[
      {d:hx-x,x:hx,y:y}, {d:hx+x,x:-hx,y:y},
      {d:hy-y,x:x,y:hy}, {d:hy+y,x:x,y:-hy}
    ].sort((u,v)=>u.d-v.d);
    qx=edges[0].x; qy=edges[0].y;
  }
  const d=inside?0:Math.hypot(qx-x,qy-y);
  const eastQ=qx*c-qy*s;
  const northQ=qx*s+qy*c;
  return {
    d,
    centerD:dist(lat,lng,ob.lat,ob.lng),
    closestLat:ob.lat+northQ/111320,
    closestLng:ob.lng+eastQ/(111320*cosLat),
    inside
  };
}

function nearest(){
  if(myLat===null || myLng===null) return null;
  let n=null, m=Infinity;
  OBSTACLES.forEach(o=>{
    const metrics=obstacleMetrics(myLat,myLng,o);
    if(metrics.d<m){m=metrics.d;n=Object.assign({},o,metrics);}
  });
  return n;
}

   回避方向は開始時に固定し、GPSのぶれで左右が入れ替わらないようにする。

}
// ⑤の条件：ルート線そのものを＞形にして、矢印の役割も持たせる
function chevron(pt,dirE,dirN,color,alpha){
  const toLL=(e,n)=>[pt[0]+n/111320,pt[1]+e/(111320*Math.cos(pt[0]*Math.PI/180))];
  const rE=dirN, rN=-dirE, w=0.55, l=0.55, t=0.38;
  const rf=[[-w,-l],[0,l-t],[w,-l],[w,-l+t],[0,l],[-w,-l+t]]
    .map(([s,f])=>{const [a,b]=toLL(rE*s+dirE*f,rN*s+dirN*f);return relRF(a,b);});
  if(rf.some(p=>p.forward<0.8)) return;
  gX.beginPath();
  rf.forEach((p,i)=>{const q=project(p.right,p.forward);i?gX.lineTo(q.x,q.y):gX.moveTo(q.x,q.y);});
  gX.closePath();gX.globalAlpha=alpha;gX.fillStyle=color;gX.fill();gX.globalAlpha=1;
}
function drawGround(){
  const W=groundC.width,H=groundC.height;
  gX.clearRect(0,0,W,H);
  if(myLat===null||exp.phase==='idle') return;
  const ob=nearest(), st=ob?obstacleState(ob):{phase:'none'};
  const guide=CONDITIONS[exp.cond].guide||'#FFD700';
  const k=Math.cos(myLat*Math.PI/180);
  // 回避範囲の輪（15m以内）
  if(ob&&ob.d<=OBS_SHOW&&!st.passed){
    const R=needClear(ob), inside=ob.d<=ob.radiusM;
    gX.beginPath();let pen=false;
    for(let a=0;a<=48;a++){
      const t=a/48*2*Math.PI;
      const rf=relRF(ob.lat+R*Math.cos(t)/111320,ob.lng+R*Math.sin(t)/(111320*k));
      if(rf.forward<-1.5){pen=false;continue;}
      const q=project(rf.right,rf.forward);
      pen?gX.lineTo(q.x,q.y):gX.moveTo(q.x,q.y);pen=true;
    }
    gX.setLineDash([10,7]);gX.lineWidth=3;gX.strokeStyle=inside?'rgba(255,70,70,0.85)':'rgba(255,170,70,0.7)';gX.stroke();gX.setLineDash([]);
  }
  // 地面のルート線
  if(routeCoords.length<2||progressIdx<0) return;
  const color=st.phase==='avoid'?'#FF6600':guide, alpha=st.phase==='avoid'?0.85:0.8;
  if(CONDITIONS[exp.cond].ground==='chevron'){
    const D=displayRoute(17);
    for(let i=2;i<D.length-1;i+=2){
      const a=D[i],b=D[i+1];
      const e=(b[1]-a[1])*111320*k,n=(b[0]-a[0])*111320,l=Math.hypot(e,n)||1;
      chevron(a,e/l,n/l,color,alpha);
    }
    return;
  }
  groundLine(displayRoute(20),color,false);
}

function dist(a,b,c,d){const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function bear(a,b,c,d){const dG=(d-b)*Math.PI/180;const y=Math.sin(dG)*Math.cos(c*Math.PI/180);const x=Math.cos(a*Math.PI/180)*Math.sin(c*Math.PI/180)-Math.sin(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.cos(dG);return(Math.atan2(y,x)*180/Math.PI+360)%360;}
function inPoly(p,vs){let i=false;for(let a=0,b=vs.length-1;a<vs.length;b=a++){const[xa,ya]=vs[a],[xb,yb]=vs[b];if(((ya>p[0])!=(yb>p[0]))&&(p[1]<(xb-xa)*(p[0]-ya)/(yb-ya)+xa))i=!i;}return i;}
function elSet(id,txt,cls){const e=document.getElementById(id);if(!e)return;e.textContent=txt;if(cls!==undefined)e.className=cls;}
</script>
